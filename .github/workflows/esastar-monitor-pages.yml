name: Geo-K Funding Monitor Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "monitoring/**"
      - ".github/workflows/esastar-monitor-pages.yml"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ESA-star monitor
        run: python3 scripts/esastar_monitor.py 300

      - name: Run EU Funding & Tenders monitor
        run: python3 scripts/eu_ft_monitor.py 25

      - name: Run ECMWF Copernicus monitor
        run: python3 scripts/ecmwf_monitor.py

      - name: Run LIFE CINEA monitor
        run: python3 scripts/life_cinea_monitor.py

      - name: Run FAO UNGM monitor
        run: python3 scripts/fao_ungm_monitor.py

      - name: Run Italian national sources monitor
        run: python3 scripts/italian_sources_monitor.py

      - name: Build static site
        run: python3 scripts/build_esastar_pages_site.py

      - name: Publish to gh-pages branch
        run: |
          set -euo pipefail

          output_dir="$(mktemp -d)"
          cp -R site/esa-star-monitor/. "$output_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git checkout -f gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$output_dir"/. .
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "Publish Geo-K funding monitor site"
            git push origin gh-pages
          fi
