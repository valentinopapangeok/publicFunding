name: ESA-star Funding Monitor Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/esastar_monitor.py"
      - "scripts/build_esastar_pages_site.py"
      - "monitoring/esa-star/**"
      - ".github/workflows/esastar-monitor-pages.yml"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ESA-star monitor
        run: python3 scripts/esastar_monitor.py 300

      - name: Build static site
        run: python3 scripts/build_esastar_pages_site.py

      - name: Publish to gh-pages branch
        run: |
          set -euo pipefail

          output_dir="$(mktemp -d)"
          cp -R site/esa-star-monitor/. "$output_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git checkout -f gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$output_dir"/. .
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "Publish ESA-star monitor site"
            git push origin gh-pages
          fi
