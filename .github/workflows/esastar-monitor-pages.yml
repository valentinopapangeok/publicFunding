name: ESA-star Funding Monitor Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/esastar_monitor.py"
      - "scripts/build_esastar_pages_site.py"
      - "monitoring/esa-star/**"
      - ".github/workflows/esastar-monitor-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ESA-star monitor
        run: python3 scripts/esastar_monitor.py 300

      - name: Build static site
        run: python3 scripts/build_esastar_pages_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/esa-star-monitor

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
